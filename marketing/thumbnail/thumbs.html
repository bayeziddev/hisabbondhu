<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>HisabBondhu thumbnails</title>
<style>
@font-face{font-family:'Hind Siliguri';src:url('../guide-video/assets/fonts/hind_siliguri_700.ttf') format('truetype');font-weight:700}
@font-face{font-family:'Hind Siliguri';src:url('../guide-video/assets/fonts/hind_siliguri_600.ttf') format('truetype');font-weight:600}
:root{--green:#087F5B;--deep:#053D2E;--amber:#FFD43B;--red:#E03131}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;font-family:'Hind Siliguri',sans-serif;color:#fff}
.thumb{position:relative;width:1280px;height:720px;overflow:hidden;margin:0 0 40px}
.abs{position:absolute}
/* heavy outlined headline that survives a 168px-wide preview */
.hl{font-weight:700;line-height:1.02;letter-spacing:-1px;-webkit-text-stroke:10px #071a14;paint-order:stroke fill;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35))}
.phone{position:absolute;background:#0b0f0e;border-radius:38px;padding:10px;box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 3px rgba(255,255,255,.18)}
.phone img{display:block;width:100%;border-radius:30px}
.pill{position:absolute;font-weight:700;border-radius:999px;display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand{position:absolute;display:flex;align-items:center;gap:12px;font-weight:700;font-size:34px;text-shadow:0 3px 10px rgba(0,0,0,.6)}
.brand img{width:56px;height:56px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
</style>
</head>
<body>

<!-- 1 — face + question hook -->
<div class="thumb" id="t1">
  <img class="abs" src="assets/shopkeeper.jpg" alt="" style="left:-5px;top:0;width:1290px;height:720px;object-fit:cover">
  <div class="abs" style="inset:0;background:linear-gradient(90deg,rgba(4,38,28,.96) 0%,rgba(4,38,28,.90) 36%,rgba(4,38,28,.55) 52%,rgba(4,38,28,0) 64%)"></div>
  <div class="abs hl" style="left:44px;top:34px;font-size:108px;color:#fff">কার কাছে</div>
  <div class="abs hl" style="left:40px;top:148px;font-size:156px;color:var(--amber)">কত বাকি?</div>
  <div class="pill" style="left:46px;top:362px;height:76px;padding:0 30px;background:#fff;color:var(--deep);font-size:44px;box-shadow:0 10px 24px rgba(0,0,0,.4)">
    <span style="color:var(--green)">✓</span> ১ ক্লিকেই সব হিসাব</div>
  <div class="brand" style="left:48px;top:612px"><img src="../guide-video/assets/icon.png" alt="">হিসাববন্ধু · ফ্রি অ্যাপ</div>
  <div class="phone" style="left:536px;top:268px;width:244px;transform:rotate(-7deg)">
    <img src="../guide-video/assets/screens/customers.png" alt="">
    <div class="abs" style="left:192px;top:212px;width:44px;height:126px;border:4px solid var(--red);border-radius:12px;box-shadow:0 0 18px rgba(224,49,49,.9)"></div>
  </div>
</div>

<!-- 2 — paper khata vs app -->
<div class="thumb" id="t2" style="background:linear-gradient(135deg,#0A6E50,var(--green) 45%,var(--deep))">
  <div class="abs" style="left:0;top:0;width:640px;height:720px;overflow:hidden">
    <img src="assets/khata.jpg" alt="" style="position:absolute;left:-250px;top:-10px;width:1290px;height:720px;object-fit:cover;filter:grayscale(.35) brightness(.8) contrast(1.1)">
    <div class="abs" style="inset:0;background:linear-gradient(0deg,rgba(120,10,10,.55),rgba(60,0,0,.15) 60%)"></div>
  </div>
  <div class="abs" style="left:636px;top:0;width:8px;height:720px;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.5)"></div>
  <!-- red X over the khata -->
  <div class="abs" style="left:150px;top:370px;width:340px;height:34px;background:var(--red);border:5px solid #fff;border-radius:18px;transform:rotate(35deg);box-shadow:0 8px 20px rgba(0,0,0,.5)"></div>
  <div class="abs" style="left:150px;top:370px;width:340px;height:34px;background:var(--red);border:5px solid #fff;border-radius:18px;transform:rotate(-35deg);box-shadow:0 8px 20px rgba(0,0,0,.5)"></div>
  <div class="pill" style="left:44px;top:600px;height:70px;padding:0 26px;background:var(--red);color:#fff;font-size:40px">✗ কাগজের খাতা</div>
  <div class="phone" style="left:884px;top:270px;width:252px;transform:rotate(7deg)"><img src="../guide-video/assets/screens/home.png" alt=""></div>
  <div class="pill" style="left:690px;top:600px;height:70px;padding:0 26px;background:#fff;color:var(--green);font-size:40px;box-shadow:0 10px 24px rgba(0,0,0,.35)">✓ হিসাববন্ধু</div>
  <div class="abs" style="left:592px;top:372px;width:96px;height:96px;border-radius:50%;background:var(--amber);color:var(--deep);font-size:64px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.45);border:5px solid #fff">➜</div>
  <div class="abs hl" style="left:0;width:1280px;top:30px;text-align:center;font-size:132px;color:#fff">খাতা <span style="color:var(--amber)">ফেলে দিন!</span></div>
  <div class="abs hl" style="left:0;width:1280px;top:188px;text-align:center;font-size:60px;color:#fff;-webkit-text-stroke:7px #071a14">দোকানের সব হিসাব এখন মোবাইলে</div>
</div>

<!-- 3 — POS style -->
<div class="thumb" id="t3" style="background:radial-gradient(700px 520px at 78% 40%,rgba(255,212,59,.22),transparent 70%),radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.8px) 0 0/34px 34px,linear-gradient(135deg,#0A6E50,var(--green) 40%,var(--deep))">
  <div class="abs hl" style="left:46px;top:40px;font-size:190px;color:var(--amber)">ফ্রি POS</div>
  <div class="abs hl" style="left:52px;top:236px;font-size:92px;color:#fff">+ হিসাব খাতা</div>
  <div class="abs" style="left:52px;top:388px;display:flex;flex-wrap:wrap;gap:14px;width:600px">
    <div class="pill" style="position:static;height:64px;padding:0 24px;background:#fff;color:var(--deep);font-size:36px">বিক্রি</div>
    <div class="pill" style="position:static;height:64px;padding:0 24px;background:var(--red);color:#fff;font-size:36px">বাকি</div>
    <div class="pill" style="position:static;height:64px;padding:0 24px;background:#fff;color:var(--deep);font-size:36px">স্টক</div>
    <div class="pill" style="position:static;height:64px;padding:0 24px;background:var(--amber);color:var(--deep);font-size:36px">লাভ</div>
  </div>
  <div class="brand" style="left:52px;top:612px"><img src="../guide-video/assets/icon.png" alt="">হিসাববন্ধু · মোবাইলে, বাংলায়</div>
  <div class="phone" style="left:860px;top:96px;width:280px;transform:rotate(6deg)"><img src="../guide-video/assets/screens/sale_entry.png" alt=""></div>
  <div class="abs" style="left:640px;top:250px;width:300px;background:#fff;color:#1f2a27;border-radius:22px;padding:18px 22px;box-shadow:0 18px 40px rgba(0,0,0,.45);transform:rotate(-4deg)">
    <div style="font-size:28px;font-weight:700;color:var(--green)">✓ বিক্রি সংরক্ষিত</div>
    <div style="font-size:56px;font-weight:700;line-height:1.15">৳১,২৫০</div>
    <div style="font-size:26px;font-weight:600;color:#5f6b67">বিকাশ · স্টক থেকে কমেছে</div>
  </div>
</div>

</body>
</html>
