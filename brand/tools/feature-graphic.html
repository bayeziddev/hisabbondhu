<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:HS;font-weight:700;src:url(../fonts/hind_siliguri_bold.ttf)}
@font-face{font-family:HS;font-weight:600;src:url(../fonts/hind_siliguri_semibold.ttf)}
@font-face{font-family:HS;font-weight:400;src:url(../fonts/hind_siliguri_regular.ttf)}
html,body{margin:0;padding:0}
.fg{width:1024px;height:500px;position:relative;overflow:hidden;font-family:HS,sans-serif;
  background:linear-gradient(135deg,#0CA678 0%,#087F5B 45%,#065F46 100%);color:#fff}
.glow{position:absolute;right:-120px;top:-160px;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),rgba(255,255,255,0) 70%)}
.ledger{position:absolute;right:56px;bottom:-40px;width:330px;height:420px;border-radius:28px;background:#fff;
  box-shadow:0 30px 60px rgba(0,0,0,.25);transform:rotate(-6deg);padding:34px 30px;box-sizing:border-box;color:#212529}
.ledger h4{margin:0 0 14px;font-size:22px;color:#087F5B}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #E9ECEF;font-size:20px}
.row b{font-weight:700}
.due{color:#C92A2A}.in{color:#1971C2}.ok{color:#2B8A3E}
.badge{position:absolute;right:34px;top:78px;width:84px;height:84px;border-radius:50%;background:#1971C2;border:6px solid #fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.left{position:absolute;left:60px;top:70px;width:590px}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:92px;height:92px;border-radius:22px;box-shadow:0 10px 26px rgba(0,0,0,.22)}
h1{font-size:84px;line-height:1;margin:0;font-weight:700;letter-spacing:.5px}
.en{font-size:24px;opacity:.9;font-weight:600;margin-top:6px}
.tag{font-size:36px;font-weight:600;margin:34px 0 22px;line-height:1.25}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:7px 13px;font-size:19px;font-weight:600}
</style></head>
<body>
<div class="fg" id="fg">
  <div class="glow"></div>
  <div class="left">
    <div class="brand"><img src="../logo-mark.svg"><div><h1>হিসাববন্ধু</h1><div class="en">HisabBondhu</div></div></div>
    <div class="tag">দোকানের হিসাব,<br>সবসময় হাতের কাছে</div>
    <div class="pills"><span class="pill">✓ ইন্টারনেট ছাড়াই চলে</span><span class="pill">✓ বাকির খাতা</span><span class="pill">✓ স্টক</span><span class="pill">✓ রিপোর্ট</span></div>
  </div>
  <div class="ledger">
    <h4>আজকের হিসাব</h4>
    <div class="row"><span>বিক্রি</span><b class="ok">৳১২,৪৫০</b></div>
    <div class="row"><span>টাকা পেলাম</span><b class="in">৳৩,২০০</b></div>
    <div class="row"><span>করিম ভাই</span><b class="due">বাকি ৳৫০০</b></div>
    <div class="row"><span>খরচ</span><b class="due">৳৮৫০</b></div>
    <div class="row"><span>হাতে টাকা</span><b>৳২৪,৮০০</b></div>
  </div>
  <div class="badge"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>
</body></html>
