name: Android — build AAB & APK

on:
  push:
    branches: [ main, 'claude/**' ]
    tags: [ 'v*' ]
    paths:
      - 'android/**'
      - 'website/privacy.html'
      - 'website/terms.html'
      - 'website/your-rights.html'
      - 'website/assets/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.1). Leave empty for default.'
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # needed to attach files to a GitHub Release on v* tags

jobs:
  build:
    name: Test, build & sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    env:
      # Play requires a higher versionCode for every upload; the run number always increases.
      VERSION_CODE: ${{ github.run_number }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      WEBSITE_URL: ${{ vars.WEBSITE_URL }}
      SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Version name
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          elif [[ -n "${{ github.event.inputs.version_name }}" ]]; then
            echo "VERSION_NAME=${{ github.event.inputs.version_name }}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "::warning title=No signing key::Add ANDROID_KEYSTORE_BASE64 and related secrets to build signed release AAB/APK (see docs/SECRETS.md)."
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify release build (R8 + lint, unsigned — no keystore secret yet)
        if: env.HAS_SIGNING != 'true'
        run: ./gradlew --no-daemon bundleRelease

      - name: Build signed release AAB + APK
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Collect outputs
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/HisabBondhu-${VERSION_NAME}-debug.apk"
          if [ "$HAS_SIGNING" = "true" ]; then
            cp app/build/outputs/bundle/release/app-release.aab "../dist/HisabBondhu-${VERSION_NAME}-release.aab"
            cp app/build/outputs/apk/release/app-release.apk "../dist/HisabBondhu-${VERSION_NAME}-release.apk"
            cp app/build/outputs/mapping/release/mapping.txt "../dist/mapping-${VERSION_NAME}.txt" || true
          fi
          ls -la ../dist
          {
            echo "### HisabBondhu ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in ../dist/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HisabBondhu-${{ env.VERSION_NAME }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Room schema (commit it before changing the database)
        uses: actions/upload-artifact@v4
        with:
          name: room-schema
          path: android/app/schemas
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports
          retention-days: 7

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
