name: Backend — test & deploy (Cloudflare)

on:
  push:
    branches: [ main, 'claude/**' ]
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]
  pull_request:
    paths: [ 'backend/**', '.github/workflows/backend.yml' ]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Typecheck, unit + end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end test on a local Worker + local D1
        run: |
          printf 'APP_ENV=development\nOTP_DEV_MODE=true\nEMAIL_PROVIDER=log\nSMS_PROVIDER=log\nPHONE_OTP_ENABLED=true\nADMIN_TOKEN=local-admin-token-0123456789abcdef\nJWT_SECRET=%s\nOTP_PEPPER=%s\nREVIEW_EMAIL=play.review@example.com\nREVIEW_OTP=246810\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .dev.vars
          npx wrangler d1 migrations apply hisabbondhu --local
          npx wrangler dev --local --port 8787 --ip 127.0.0.1 > wrangler-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/v1/health >/dev/null && break; sleep 1; done
          API=http://127.0.0.1:8787 node scripts/e2e.mjs || { cat wrangler-dev.log; exit 1; }
      - name: Validate production config
        run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secrets::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (see docs/SECRETS.md)."
            exit 1
          fi

      - name: Create / find D1 database
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="hisabbondhu") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create hisabbondhu --location apac
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="hisabbondhu") | .uuid')
          fi
          echo "D1 database id: $ID"
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml

      - name: R2 bucket (optional — needs R2 activated in Cloudflare)
        run: |
          if npx wrangler r2 bucket list 2>/dev/null | grep -q "hisabbondhu-files"; then
            echo "R2 bucket exists"
          elif npx wrangler r2 bucket create hisabbondhu-files; then
            echo "R2 bucket created"
          else
            echo "::warning title=R2 not available::R2 is not activated on this Cloudflare account (it needs a payment method, even for the free tier). Deploying without file storage — D1's automatic 30-day backups still protect your data."
            sed -i '/^\[\[r2_buckets\]\]/,/^$/d' wrangler.toml
          fi

      - name: Create queue (if missing)
        run: |
          if ! npx wrangler queues info hisabbondhu-jobs >/dev/null 2>&1; then
            if ! npx wrangler queues create hisabbondhu-jobs; then
              echo "::warning::Queues not available on this account — deploying without the queue (jobs run inline)."
              sed -i '/^\[\[queues\./,/^$/d' wrangler.toml
            fi
          fi

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply hisabbondhu --remote

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail   # a failed deploy must fail the job (it was hidden by "| tee" before)
          ARGS=""
          [ -n "${{ vars.ALLOWED_ORIGINS }}" ] && ARGS="$ARGS --var ALLOWED_ORIGINS:${{ vars.ALLOWED_ORIGINS }}"
          [ -n "${{ vars.SMS_PROVIDER }}" ] && ARGS="$ARGS --var SMS_PROVIDER:${{ vars.SMS_PROVIDER }}"
          [ -n "${{ vars.PHONE_OTP_ENABLED }}" ] && ARGS="$ARGS --var PHONE_OTP_ENABLED:${{ vars.PHONE_OTP_ENABLED }}"
          npx wrangler deploy $ARGS 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Upload Worker secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          SMS_SENDER_ID: ${{ secrets.SMS_SENDER_ID }}
          SMS_API_URL: ${{ secrets.SMS_API_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          REVIEW_OTP: ${{ secrets.REVIEW_OTP }}
          SUPPORT_WEBHOOK_URL: ${{ secrets.SUPPORT_WEBHOOK_URL }}
        run: |
          if [ -z "$JWT_SECRET" ] || [ -z "$OTP_PEPPER" ] || [ -z "$RESEND_API_KEY" ]; then
            echo "::error::JWT_SECRET, OTP_PEPPER and RESEND_API_KEY secrets are required."; exit 1
          fi
          jq -n 'env | with_entries(select(.key | IN("JWT_SECRET","OTP_PEPPER","RESEND_API_KEY","ADMIN_TOKEN","SMS_API_KEY","SMS_SENDER_ID","SMS_API_URL","REVIEW_EMAIL","REVIEW_OTP","SUPPORT_WEBHOOK_URL"))) | with_entries(select(.value != ""))' > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"

      - name: Smoke test
        env:
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          REVIEW_OTP: ${{ secrets.REVIEW_OTP }}
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "::warning::No workers.dev URL in the deploy output. Enable it: Cloudflare → Workers → hisabbondhu-api → Settings → Domains & Routes → workers.dev → Enable."
          else
            sleep 5
            curl -sf "$URL/v1/health" | tee /dev/stderr | grep -q '"ok":true'
            # The Google Play reviewer must be able to sign in, or the app is rejected.
            if [ -n "$REVIEW_EMAIL" ] && [ -n "$REVIEW_OTP" ]; then
              body=$(jq -nc --arg e "$REVIEW_EMAIL" '{email:$e}')
              curl -s -o req.json -w '%{http_code}' -H 'content-type: application/json' -d "$body" "$URL/v1/auth/request-otp" | grep -q 200 \
                || { echo "::error::Reviewer account: request-otp failed: $(cat req.json)"; exit 1; }
              body=$(jq -nc --arg e "$REVIEW_EMAIL" --arg c "$REVIEW_OTP" '{email:$e,code:$c,device_name:"deploy smoke test"}')
              curl -s -o ver.json -H 'content-type: application/json' -d "$body" "$URL/v1/auth/verify-otp"
              jq -e '.access_token | length > 0' ver.json >/dev/null \
                || { echo "::error::Reviewer account cannot sign in: $(jq -c '{error,message}' ver.json)"; exit 1; }
              echo "Reviewer account sign-in works"
              echo "Google Play reviewer sign-in: OK" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::REVIEW_EMAIL / REVIEW_OTP secrets missing: Google Play reviewers cannot sign in"
            fi
            echo "### API deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
            echo "Set repository variable **API_BASE_URL** = \`$URL/\` so the Android build talks to it." >> "$GITHUB_STEP_SUMMARY"
          fi
