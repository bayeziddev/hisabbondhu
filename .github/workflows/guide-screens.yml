name: Guide screens — full feature tour (emulator)

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/**' ]
    paths:
      - 'android/app/src/androidTest/java/com/hisabbondhu/app/GuideTour.kt'
      - 'android/tools/guide-tour.sh'
      - '.github/workflows/guide-screens.yml'

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    name: Guide tour (phone, Bangla)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app + tour APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run guide tour on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash android/tools/guide-tour.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-screens
          path: screenshots/guide/

  collect:
    name: Commit guide screens to the branch
    needs: tour
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: guide-screens
          path: guide
      - name: Commit guide screens
        run: |
          mkdir -p brand/guide/raw
          find guide -name '*.png' -exec cp {} brand/guide/raw/ \;
          cp guide/logcat.txt brand/guide/raw/logcat.txt 2>/dev/null || true
          cp guide/instrument.log brand/guide/raw/instrument.log 2>/dev/null || true
          ls -la brand/guide/raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand/guide/raw
          if git diff --cached --quiet; then echo "No guide screens to commit"; exit 0; fi
          git commit -m "Update guide screens from emulator tour [skip ci]"
          for i in 1 2 3; do git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && break; sleep 5; done
