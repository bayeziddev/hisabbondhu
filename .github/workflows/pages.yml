name: Website — GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'website/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare site
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          mkdir -p _site
          rsync -a --exclude tools website/ _site/
          if [ -n "$API_BASE_URL" ]; then sed -i "s#__API_BASE__#${API_BASE_URL%/}#" _site/assets/config.js; fi
          if [ -n "$SUPPORT_EMAIL" ]; then
            grep -rl "support@hisabbondhu.com" _site | xargs sed -i "s/support@hisabbondhu.com/${SUPPORT_EMAIL}/g"
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
